<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>مراسلة المحل</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; text-align: center;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #f4f1ea; color: #16241b; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; }
  p { color: #5f7265; line-height: 1.8; margin: 0; }
  code { direction: ltr; unicode-bidi: embed; }
  .dot { display: inline-block; width: 10px; height: 10px; margin: 0 3px 18px; border-radius: 50%; background: #14532d; animation: b 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes b { to { opacity: .2; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <h1>جاري الاتصال بالمركز…</h1>
    <p id="client-help">تأكد أن الحاسوب الرئيسي مشتغل وأن برنامج المراسلة يعمل عليه.<br>
    العنوان الحالي: <code id="server"></code><br>
    البرنامج يبحث عن المركز وحده كل بضع ثوانٍ.</p>
    <p id="center-help" hidden>جاري تشغيل المركز على هذا الحاسوب… لحظات.</p>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('server').textContent = q.get('server') || '';
  if (q.get('center')) { document.getElementById('client-help').hidden = true; document.getElementById('center-help').hidden = false; }
</script>
</body>
</html>
