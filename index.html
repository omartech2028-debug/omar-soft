<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="عمر سوفت">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>عمر سوفت للخدمات</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f9; overflow: hidden; font-family: Tahoma, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f4f6f9; }
  #ld { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f4f6f9; color: #1e3a8a; text-align: center; padding: 20px; }
  #ld img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 8px 22px rgba(30,58,138,.25); }
  #ld b { font-size: 20px; }
  .spin { width: 34px; height: 34px; border: 4px solid #dbe4ff; border-top-color: #1e3a8a; border-radius: 50%; animation: r .9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  #fb { display: none; margin-top: 6px; background: #1e3a8a; color: #fff; text-decoration: none; border-radius: 10px; padding: 11px 18px; font-weight: bold; font-size: 14px; }
  #cfg { display: none; max-width: 420px; background: #fff3cd; border: 1px solid #ffc107; color: #7a5c00; border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.8; }
</style>
</head>
<body>
  <div id="ld">
    <img src="icon-192.png" alt="">
    <b>عمر سوفت للخدمات</b>
    <div class="spin"></div>
    <div id="lt" style="font-size:13px; color:#6c757d;">جارٍ فتح المنصة...</div>
    <a id="fb" href="#" target="_top">إن لم تظهر المنصة اضغط هنا لفتحها مباشرة</a>
    <div id="cfg">⚙️ لم يُضبط رابط المنصة بعد.<br>افتح ملف <b>index.html</b> وضع رابط <b>/exec</b> في السطر الذي يبدأ بـ <b>var APP</b>.</div>
  </div>
  <iframe id="app" title="عمر سوفت" allow="camera *; geolocation *; microphone *; clipboard-read *; clipboard-write *; fullscreen *" allowfullscreen></iframe>
<script>
  /* =================================================================
     السطر الوحيد الذي تغيّره عند أي نشر جديد برابط مختلف:
     انسخ رابط /exec من Apps Script ← Deploy ← Manage deployments
     ================================================================= */
  var APP = "https://script.google.com/macros/s/AKfycbwi3SBBwzjpVpRT0Uyjjhn7KnaMmAeMkwZ3qUyxIVEiEPqf1QueYHwewdpOcYMukhkEQA/exec";

  (function () {
    var ld = document.getElementById('ld'), fb = document.getElementById('fb'), f = document.getElementById('app'), lt = document.getElementById('lt');
    if (APP.indexOf('https://script.google.com/') !== 0) { document.querySelector('.spin').style.display = 'none'; document.getElementById('cfg').style.display = 'block'; return; }
    // تمرير المعاملات كما هي: ?m=1 لوضع الهاتف ، ?p=att لصفحة الحضور
    var target = APP + (location.search || '');
    // صفحة الحضور (كود QR المعلّق في المحل) تُفتح مباشرة كما كانت سابقاً — حتى يبقى ربط هواتف العمال كما هو
    if (/[?&]p=(att|attdo)(&|$)/.test(location.search || '')) { location.replace(target); return; }
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
    /* v2: بعض الهواتف (خاصة الآيفون) ترفض فتح منصة Google داخل هذه الصفحة وتُظهر «401 حدث خطأ».
       المنصة ترسل إشارة «فُتحت» — إن لم تصل نفتحها مباشرة، ويتذكر الهاتف ذلك 3 أيام. */
    var KEY = 'omarsoftDirect', ready = false, gone = false;
    function remember() { try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} }
    function go() { if (ready || gone) return; gone = true; remember(); lt.textContent = 'جارٍ فتح المنصة مباشرة...'; fb.style.display = 'none'; location.replace(target); }
    fb.href = target;
    fb.addEventListener('click', remember);
    var last = 0; try { last = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
    /* الآيفون والآيباد (سفاري وكروم معاً) يرفضان المنصة داخل الإطار ← نفتحها مباشرة فوراً */
    var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (location.hash !== '#frame' && (iOS || (last && Date.now() - last < 3 * 86400000))) { go(); return; }
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.omarsoft !== 'ready') return;
      ready = true; ld.style.display = 'none';
      try { localStorage.removeItem(KEY); } catch (e2) {}
    });
    f.src = target;
    var loaded = false;
    f.addEventListener('load', function () { if (loaded) return; loaded = true; setTimeout(go, 12000); });
    setTimeout(function () { if (!ready && !gone) fb.style.display = 'inline-block'; }, 5000);
    setTimeout(go, 30000);
  })();
</script>
</body>
</html>
